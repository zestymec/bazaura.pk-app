# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# AndroidX package structure
android.useAndroidX=true

# Enable AAPT2 PNG crunching
android.enablePngCrunchInReleaseBuilds=true

# Architectures
# Real phones are ARM; x86 is emulator-only. Dropping it shrinks the APK ~40%.
# Add x86_64 back temporarily if you need to test on an Intel emulator.
reactNativeArchitectures=armeabi-v7a,arm64-v8a

# Enable support for the New Architecture (TurboModules & Fabric)
newArchEnabled=true

# Use Hermes JS engine
hermesEnabled=true

# Release optimisation: R8 code shrinking + unused resource removal
android.enableProguardInReleaseBuilds=true
android.enableShrinkResourcesInReleaseBuilds=true
